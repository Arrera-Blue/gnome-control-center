<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <!-- Cadre / Écran monochrome -->
  <rect x="2" y="2" width="236" height="136" rx="8" ry="8" fill="#141414" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Barre supérieure monochrome -->
  <rect x="4" y="4" width="232" height="14" fill="#222222"/>
  <line x1="4" y1="18" x2="236" y2="18" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15"/>
  <!-- Logo / Bouton gauche -->
  <circle cx="16" cy="11" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Horloge au centre -->
  <rect x="105" y="9" width="30" height="4" rx="2" fill="#ffffff" fill-opacity="0.75"/>
  <!-- Paramètres rapides droite -->
  <rect x="206" y="8" width="22" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Grand menu d'applications centré (plan schématique) -->
  <rect x="65" y="28" width="110" height="68" rx="6" fill="#1c1c1c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Barre de recherche -->
  <rect x="74" y="34" width="92" height="6" rx="3" fill="#2a2a2a"/>
  <!-- Grille d'icônes monochromes -->
  <rect x="78" y="46" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="96" y="46" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="114" y="46" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="132" y="46" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="150" y="46" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>

  <rect x="78" y="64" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="96" y="64" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="114" y="64" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="132" y="64" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="150" y="64" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Dock flottant centré en bas -->
  <rect x="70" y="115" width="100" height="17" rx="8.5" fill="#222222" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="82" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="96" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="110" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="124" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="138" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="152" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.6"/>
</svg>
