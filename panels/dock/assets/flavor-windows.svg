<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <!-- Cadre / Écran monochrome -->
  <rect x="2" y="2" width="236" height="136" rx="8" ry="8" fill="#141414" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Pas de top bar (bureau plein) -->
  <!-- Fenêtre applicative schématique -->
  <rect x="40" y="16" width="160" height="74" rx="6" fill="#1b1b1b" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.25"/>
  <rect x="40" y="16" width="160" height="13" rx="4" fill="#242424"/>
  <rect x="49" y="20.5" width="24" height="4" rx="2" fill="#ffffff" fill-opacity="0.3"/>
  <!-- Boutons de gestion de fenêtre à droite -->
  <circle cx="176" cy="22.5" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="184" cy="22.5" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="192" cy="22.5" r="2.5" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Menu Démarrer compact au-dessus de la barre en bas à gauche -->
  <rect x="8" y="44" width="76" height="74" rx="6" fill="#1c1c1c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="14" y="50" width="64" height="6" rx="3" fill="#2a2a2a"/>
  <!-- Tuiles du menu démarrer -->
  <rect x="15" y="62" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="31" y="62" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="47" y="62" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="63" y="62" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="15" y="78" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="31" y="78" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="47" y="78" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="63" y="78" width="12" height="12" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Barre des tâches permanente pleine largeur en bas -->
  <rect x="4" y="120" width="232" height="16" fill="#222222"/>
  <line x1="4" y1="120" x2="236" y2="120" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Bouton Démarrer (4 carrés) -->
  <g transform="translate(10, 124)">
    <rect x="0" y="0" width="3.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="4.5" y="0" width="3.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="0" y="4.5" width="3.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="4.5" y="4.5" width="3.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- Icônes d'applications alignées à gauche -->
  <circle cx="28" cy="128" r="4" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="40" cy="128" r="4" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="52" cy="128" r="4.2" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="64" cy="128" r="4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="76" cy="128" r="4" fill="#ffffff" fill-opacity="0.75"/>

  <!-- Zone de notification à droite (Quick settings + Horloge) -->
  <rect x="176" y="125" width="18" height="6" rx="2" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="198" y="125" width="32" height="6" rx="2" fill="#ffffff" fill-opacity="0.75"/>
</svg>
